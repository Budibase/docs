name: Sync docs to Front Knowledge Base

on:
  workflow_dispatch:

jobs:
  sync-front-knowledge-base:
    runs-on: ubuntu-latest
    env:
      FRONT_API_TOKEN: ${{ secrets.FRONT_API_TOKEN }}
      FRONT_KNOWLEDGE_BASE_ID: ${{ secrets.FRONT_KNOWLEDGE_BASE_ID }}
      FRONT_AUTHOR_ID: ${{ secrets.FRONT_AUTHOR_ID }}
      README_API_TOKEN: ${{ secrets.README_API_TOKEN }}
      README_VERSION: ${{ secrets.README_VERSION }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Get changed files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            files=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | jq -R -s -c 'split("\n")[:-1]')
          else
            files=$(git ls-files | jq -R -s -c 'split("\n")[:-1]')
          fi

          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Sync docs to Front Knowledge Base
        env: 
          FRONT_API_TOKEN: ${{ secrets.FRONT_API_TOKEN }}
          FRONT_KNOWLEDGE_BASE_ID: ${{ secrets.FRONT_KNOWLEDGE_BASE_ID }}
          FRONT_AUTHOR_ID: ${{ secrets.FRONT_AUTHOR_ID }}
        run: node scripts/sync-front-knowledge-base.js -- '${{ steps.changed-files.outputs.files }}'
